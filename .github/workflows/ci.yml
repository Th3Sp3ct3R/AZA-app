name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Build & test (Node, ${{ matrix.os }})
    # Ares is a Windows-first product (PowerShell tools, Tauri shell), yet the
    # test suite historically only ran on Linux. Run the same build + tests on
    # both Ubuntu and Windows so platform-specific regressions surface in CI.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # No version here on purpose — action-setup reads pnpm from the
      # "packageManager" field in package.json (pinning both errors out).
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The npm-ci equivalent for a pnpm workspace: reproducible, lockfile-pinned.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: node --import ./tests/_isolate-home.mjs --test tests/*.test.mjs

  coverage:
    name: Coverage (Node built-in)
    # Zero-dependency coverage via Node 22's built-in test runner. No c8/nyc —
    # --experimental-test-coverage prints an lcov-style summary table to the log.
    # Linux-only is fine here; this measures coverage, not platform behavior.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # --experimental-test-coverage is a Node 22 feature; the matrix job above
      # already pins node-version 22, so this flag is safe to use here.
      - name: Test with coverage
        run: node --import ./tests/_isolate-home.mjs --test --experimental-test-coverage tests/*.test.mjs

  rust:
    name: Build (Rust desktop shell, ${{ matrix.os }})
    # The Tauri crate is Windows-first (windows-sys / WebView2), and Windows
    # stays the job that matches the real release target. Linux is added because
    # nothing here compiled the crate for Linux at all, so a Linux-only build
    # break would have reached a release unnoticed. The webkit2gtk "dance" this
    # job used to avoid is four apt packages, below, and the crate needs no
    # Cargo.toml change to build.
    #
    # What this does NOT catch, stated plainly so the job is not trusted for
    # more than it does: runtime defects. The startup abort in #3 is a GTK
    # window-realization rule that only fires when the app runs and a window is
    # mapped. `cargo build` and the crate's unit tests — pure path helpers, no
    # display server — both stay green while the desktop aborts on launch.
    # Catching that class needs a Linux smoke test that actually launches the
    # shell and checks it survives; this job is the prerequisite for one, not a
    # substitute.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # webkit2gtk and its friends are the Tauri Linux system dependencies; the
      # Windows runner carries WebView2 already and needs none of this.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tauri-build embeds the frontend (frontendDist: ../dist) at compile time,
      # so the web bundle must exist before cargo build. This is the vite build
      # only — the NSIS installer and the heavy runtime bundle are NOT built here.
      - name: Build web frontend
        run: pnpm --filter ares-tauri build:web

      # tauri-build validates that the bundle's `runtime/` resource path exists at
      # compile time. The real runtime (bundled node + Playwright) is produced by
      # `build:runtime` at packaging time, which we deliberately skip in CI — a
      # one-file stub satisfies the existence check so cargo build can prove the
      # shell compiles.
      - name: Stub the runtime resource dir
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tauri/src-tauri/runtime | Out-Null
          Set-Content tauri/src-tauri/runtime/.ci-placeholder "stub; real runtime is built by build:runtime at packaging time"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      - name: cargo build
        run: cargo build --manifest-path tauri/src-tauri/Cargo.toml

      # The crate's unit tests are pure helpers (path resolution and the like),
      # no window and no display server involved, so they run on both runners.
      - name: cargo test
        run: cargo test --manifest-path tauri/src-tauri/Cargo.toml
